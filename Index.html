<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App e-Commerce Ropa</title>
</head>
<body>
    <header>
        <p>Hello, Welcome 👋</p>
        <h1>Nancy Aldana</h1>
        <img src="Storage/Img/Perfil.jpg" alt="Foto de perfil" width="100" height="100">
    </header>
    <main>
        <input type="text" placeholder="🔍 Search Clothes..." id="searchInput">
        <button type="button" class="BotonFiltro">
            <img src="Storage/Img/AppIcon/IconoFiltro.png" alt="Filtro" width="20" height="20">
        </button>
    </main>
    <nav class="mobile-nav">
        <a href="#inicio" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span><img src="Storage/Img/AppIcon/HomeIcon.jpg" alt="Home" width="75" height="75"></span>
        </a>
        <a href="#carrito" class="nav-item">
            <i class="fa-solid fa-cart-shopping"></i>
        <span><img src="Storage/Img/AppIcon/CarritoCompras.png" alt="Carrito" width="75"></span>
        </a>
        <a href="#favoritos" class="nav-item">
            <i class="fa-solid fa-heart"></i>
            <span><img src="Storage/Img/AppIcon/Fav.jpg" alt="Favoritos" width="75" height="75"></span>
        </a>
        <a href="#perfil" class="nav-item">
            <i class="fa-solid fa-user"></i>

</html>

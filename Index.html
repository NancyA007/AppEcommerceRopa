<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/InteractiveGrid.css">
    <link rel="stylesheet" href="CSS/Variables.css">
    <title>Catálogo</title>
</head>
<body>
    <header class="Header-Top">
        <div class="Heather">
            <h1>Logo</h1>
            <img src="Storage/Img/AppIcon/menu.svg" alt="Menu" class="Menu">
        </div>
    </header>
    <main class="Main">
        <article class="Banner">
            <div><h3>¡Gran Oferta de Inauguración!</h3></div>
            <div>Aprovecha las ofertas que tendremos durante este mes por nuestra Apertura.</div>
        </article>
        <section class="Categories-Grid">
            <article class="Categorie-Card">
                <img src="Storage/Img/AppIcon/dress.svg" alt="Dress" class="Category">
                <div class="Prueba"><a href="Products.html#Dress">Vestidos</a></div>
            </article>
            <article class="Categorie-Card">
                <img src="Storage/Img/AppIcon/t-shirt.svg" alt="Top" class="Category">
                <div><a href="Products.html#TShirt">Camisetas y Tops</a></div>
            </article>
            <article class="Categorie-Card">
                <img src="Storage/Img/AppIcon/jeans.svg" alt="Jeans" class="Category">
                <div><a href="Products.html#Jeans">Vaqueros y Jeans</a></div>
            </article>
            <article class="Categorie-Card">
                <img src="Storage/Img/AppIcon/sweatshirt.svg" alt="Sweaters" class="Category">
                <div><a href="Products.html#Sweaters">Sudaderas y Suéteres</a></div>
            </article>
            <article class="Categorie-Card">
                <img src="Storage/Img/AppIcon/coats.svg" alt="Coats" class="Category">
                <div><a href="Products.html#Coats">Chaquetas y Abrigos</a></div>
            </article>
            <article class="Categorie-Card">
                <img src="Storage/Img/AppIcon/pants.svg" alt="Pants" class="Category">
                <div><a href="Products.html#Pants">Pantalones y Shorts</a></div>
            </article>
            <article class="Categorie-Card">
                <img src="Storage/Img/AppIcon/blouse.svg" alt="Blouses" class="Category">
                <div><a href="Products.html#Shirts">Camisas y Blusas</a></div>
            </article>
            <article class="Categorie-Card">
                <img src="Storage/Img/AppIcon/footwear.svg" alt="Footwear" class="Category">
                <div><a href="Products.html#Footwear">Calzado</a></div>
            </article>
            <article class="Categorie-Card">
                <img src="Storage/Img/AppIcon/pijama.svg" alt="Sleepwear" class="Category">
                <div><a href="Products.html#Sleepwear">Ropa de Dormir y Lounge</a></div>
            </article>
            <article class="Categorie-Card">
                <img src="Storage/Img/AppIcon/accessory.svg" alt="Accessories" class="Category">
                <div><a href="Products.html#Accessories">Accesorios de Moda</a></div>
            </article>
        </section>
    </main>
</body>
</html>
